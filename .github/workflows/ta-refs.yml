name: TA support-reference check

# Asserts every id in api/src/taSupportReferences.ts still resolves to a real
# article in unfoldingWord/en_ta. Deliberately NOT part of CI: it calls
# git.door43.org, and CI in this repo is offline/deterministic by design — a
# Door43 outage must never redden an unrelated PR.
#
# It runs nightly instead, because the failure mode is upstream drift (en_ta
# renames or retires an article) as much as our own typos, and drift has no
# commit here to hang a check on. Also runnable on demand from the Actions tab.
on:
  schedule:
    # 04:30 UTC — an hour before the 05:30 export cron, so a dead id shows up
    # before the night's notes ship to Door43.
    - cron: "30 4 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate support-reference ids against en_ta
        run: npm --workspace api run check:ta-refs
