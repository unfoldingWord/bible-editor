name: CI

# Runs on every PR and on pushes to main. Fast, deterministic checks only:
# typecheck + web unit tests (the alignment/replace regression suites) + build.
# The Playwright e2e suite is intentionally NOT gated here yet — it spins up
# Vite + Wrangler and is slower/flakier; add it once it proves stable in CI.
on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same PR cancels the older in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      # tsc --noEmit across both api/ and web/ workspaces.
      - name: Typecheck
        run: npm run typecheck

      # eslint.config.js: react-hooks/rules-of-hooks (error, expected 0
      # findings) + react-hooks/exhaustive-deps (warn-only, ~400 existing
      # call sites not yet triaged — see issue #842). No --max-warnings 0:
      # the warn-level findings are intentionally non-blocking for now.
      - name: Lint
        run: npm run lint

      # Alignment / replace / morph / conflict regression suites — the real
      # safety net for the edit engine (see CLAUDE.md).
      - name: Web unit tests
        run: npm --workspace web run test

      # Export/import/lint/validate suites. Ungated until now, which meant
      # regression tests in api/ protected nothing automatically.
      - name: API unit tests
        run: npm --workspace api run test

      # Number-split repair core regression suite (issue #452). Pure
      # functions over synthetic fixtures — no servers, no production dump.
      # scripts/run-tests.mjs only globs <workspace>/src, so this file isn't
      # auto-discovered by the steps above; gate it explicitly (see #840).
      - name: Script unit tests
        run: npm run test:scripts

      # api typecheck + web vite build -> web/dist. Catches bundling breaks.
      - name: Build
        run: npm run build
